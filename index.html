<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abbinamento Portieri Fantacalcio 26/27</title>
    <style>
        :root {
            --bg-color: #0f0c1b;
            --card-bg: #1a1528;
            --accent: #00e676;
            --text: #ffffff;
            --subtext: #a09cb0;
            --border: #2a2438;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 900px;
            width: 100%;
        }

        h1 {
            text-align: center;
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #fff;
        }

        /* Sezione Selettori */
        .selectors-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        select {
            background-color: var(--card-bg);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            width: 100%;
            cursor: pointer;
        }

        /* Card Risultati */
        .score-card {
            background: linear-gradient(145deg, #18221c, #131a18);
            border: 1px solid var(--accent);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0, 230, 118, 0.15);
        }

        .circle-score {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 5px solid var(--accent);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .score-val { font-size: 1.8rem; color: var(--accent); line-height: 1; }
        .score-max { font-size: 0.8rem; color: var(--subtext); }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            text-align: center;
        }

        .stat-box {
            background-color: rgba(255,255,255,0.05);
            padding: 8px 12px;
            border-radius: 8px;
        }

        .stat-num { font-size: 1.2rem; font-weight: bold; }
        .stat-num.easy { color: #00e676; }
        .stat-num.medium { color: #ffb300; }
        .stat-num.hard { color: #ff5252; }
        .stat-label { font-size: 0.75rem; color: var(--subtext); }

        /* Matrice Calendario */
        .matrix-container {
            overflow-x: auto;
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            border: 1px solid var(--border);
            margin-bottom: 20px;
        }

        .matrix {
            display: grid;
            grid-template-columns: 70px repeat(38, 55px);
            gap: 5px;
            align-items: center;
            font-size: 0.75rem;
        }

        .cell {
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            font-weight: bold;
            background-color: #231d33;
            text-align: center;
        }

        .cell.header { background-color: transparent; color: var(--subtext); }
        .cell.team-name { justify-content: flex-start; padding-left: 5px; background: none; }
        .cell.best { border: 2px solid var(--accent); }
        .cell.easy-bg { background-color: #1b3a2b; color: #00e676; }
        .cell.medium-bg { background-color: #3a311b; color: #ffb300; }
        .cell.hard-bg { background-color: #3a1b1b; color: #ff5252; }

        /* Sezione Salvataggio */
        .save-section {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 1;
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            color: #fff;
            padding: 10px;
            border-radius: 8px;
        }

        button {
            background-color: var(--accent);
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .saved-list {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            border: 1px solid var(--border);
        }

        .saved-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid var(--border);
        }

        .saved-item:last-child { border-bottom: none; }
        .btn-delete { background-color: #ff5252; color: #fff; padding: 5px 10px; font-size: 0.8rem; }
    </style>
</head>
<body>

<div class="container">
    <h1>Griglia Portieri Serie A 2026/2027</h1>

    <!-- Selezione Squadre -->
    <div class="selectors-grid">
        <select id="team1" onchange="calculate()"></select>
        <select id="team2" onchange="calculate()"></select>
        <select id="team3" onchange="calculate()"></select>
    </div>

    <!-- Risultati / Score -->
    <div class="score-card">
        <div class="circle-score">
            <span class="score-val" id="scoreVal">0</span>
            <span class="score-max">/100</span>
        </div>
        <div class="stats-grid">
            <div class="stat-box">
                <div class="stat-num easy" id="easyCount">0</div>
                <div class="stat-label">Facili</div>
            </div>
            <div class="stat-box">
                <div class="stat-num medium" id="mediumCount">0</div>
                <div class="stat-label">Medie</div>
            </div>
            <div class="stat-box">
                <div class="stat-num hard" id="hardCount">0</div>
                <div class="stat-label">Difficili</div>
            </div>
        </div>
    </div>

    <!-- Matrice Calendario -->
    <div class="matrix-container">
        <div class="matrix" id="matrix"></div>
    </div>

    <!-- Salvataggio -->
    <div class="save-section">
        <input type="text" id="comboName" placeholder="Nome combinazione (es. Trio Juve-Torino-Monza)">
        <button onclick="saveCombo()">Salva</button>
    </div>

    <div class="saved-list">
        <h3>Combinazioni Salvate</h3>
        <div id="savedContainer">Nessuna combinazione salvata.</div>
    </div>
</div>

<script>
    // Squadre Serie A 26/27
    const teams = ["ATA", "BOL", "CAG", "COM", "FIO", "FRO", "GEN", "INT", "JUV", "LAZ", "LEC", "MIL", "MON", "NAP", "PAR", "ROM", "SAS", "TOR", "UDI", "VEN"];
    
    // Mappa 8 Fasce di forza
    const teamTiers = {
        "ROM": 1, "INT": 1,
        "JUV": 2, "MIL": 2,
        "ATA": 3, "NAP": 3, "COM": 3,
        "LAZ": 4, "FIO": 4, "TOR": 4,
        "BOL": 5, "UDI": 5,
        "CAG": 6, "SAS": 6,
        "GEN": 7, "PAR": 7, "FRO": 7,
        "MON": 8, "LEC": 8, "VEN": 8
    };

    // Calendario Reale Serie A 2026/2027 (G1 - G38)
    const rawMatches = [
        // G1
        ["ATA","SAS"], ["BOL","LAZ"], ["FRO","JUV"], ["GEN","NAP"], ["INT","MON"], ["PAR","CAG"], ["ROM","FIO"], ["TOR","MIL"], ["UDI","COM"], ["VEN","LEC"],
        // G2
        ["ATA","BOL"], ["CAG","INT"], ["FIO","FRO"], ["JUV","PAR"], ["LAZ","GEN"], ["LEC","ROM"], ["MIL","VEN"], ["MON","UDI"], ["NAP","COM"], ["SAS","TOR"],
        // G3
        ["BOL","SAS"], ["CAG","LEC"], ["FIO","TOR"], ["FRO","VEN"], ["GEN","COM"], ["INT","NAP"], ["JUV","MIL"], ["PAR","MON"], ["ROM","ATA"], ["UDI","LAZ"],
        // G4
        ["ATA","CAG"], ["COM","PAR"], ["GEN","FRO"], ["INT","UDI"], ["LAZ","MIL"], ["LEC","MON"], ["NAP","BOL"], ["SAS","JUV"], ["TOR","ROM"], ["VEN","FIO"],
        // G5
        ["BOL","TOR"], ["FIO","NAP"], ["FRO","COM"], ["JUV","ATA"], ["MIL","LEC"], ["MON","SAS"], ["PAR","GEN"], ["ROM","INT"], ["UDI","CAG"], ["VEN","LAZ"],
        // G6
        ["ATALANTA","VENEZIA"], ["CAGLIARI","JUVENTUS"], ["COMO","ROMA"], ["GENOA","FIORENTINA"], ["INTER","PARMA"], ["LAZIO","MONZA"], ["LECCE","BOLOGNA"], ["NAPOLI","FROSINONE"], ["SASSUOLO","MILAN"], ["TORINO","UDINESE"],
        // G7
        ["BOLOGNA","INTER"], ["FIORENTINA","COMO"], ["FROSINONE","SASSUOLO"], ["JUVENTUS","LAZIO"], ["MILAN","ATALANTA"], ["MONZA","CAGLIARI"], ["PARMA","TORINO"], ["ROMA","GENOA"], ["UDINESE","LECCE"], ["VENEZIA","NAPOLI"],
        // G8
        ["ATALANTA","FROSINONE"], ["CAGLIARI","BOLOGNA"], ["COMO","SASSUOLO"], ["GENOA","VENEZIA"], ["INTER","FIORENTINA"], ["LAZIO","PARMA"], ["LECCE","JUVENTUS"], ["NAPOLI","ROMA"], ["TORINO","MONZA"], ["UDINESE","MILAN"],
        // G9
        ["FIORENTINA","ATALANTA"], ["FROSINONE","LECCE"], ["GENOA","JUVENTUS"], ["MILAN","BOLOGNA"], ["MONZA","NAPOLI"], ["PARMA","UDINESE"], ["ROMA","CAGLIARI"], ["SASSUOLO","LAZIO"], ["TORINO","COMO"], ["VENEZIA","INTER"],
        // G10
        ["ATALANTA","PARMA"], ["BOLOGNA","MONZA"], ["COMO","VENEZIA"], ["FROSINONE","TORINO"], ["JUVENTUS","NAPOLI"], ["LAZIO","CAGLIARI"], ["LECCE","GENOA"], ["MILAN","INTER"], ["SASSUOLO","FIORENTINA"], ["UDINESE","ROMA"],
        // G11
        ["CAGLIARI","FROSINONE"], ["FIORENTINA","JUVENTUS"], ["GENOA","MILAN"], ["INTER","COMO"], ["MONZA","ATALANTA"], ["NAPOLI","LAZIO"], ["PARMA","BOLOGNA"], ["ROMA","SASSUOLO"], ["TORINO","LECCE"], ["VENEZIA","UDINESE"],
        // G12
        ["ATALANTA","INTER"], ["BOLOGNA","UDINESE"], ["COMO","CAGLIARI"], ["JUVENTUS","VENEZIA"], ["LAZIO","LECCE"], ["MILAN","FROSINONE"], ["MONZA","FIORENTINA"], ["NAPOLI","TORINO"], ["PARMA","ROMA"], ["SASSUOLO","GENOA"],
        // G13
        ["CAGLIARI","MILAN"], ["COMO","JUVENTUS"], ["FROSINONE","PARMA"], ["INTER","GENOA"], ["LECCE","ATALANTA"], ["ROMA","MONZA"], ["SASSUOLO","NAPOLI"], ["TORINO","LAZIO"], ["UDINESE","FIORENTINA"], ["VENEZIA","BOLOGNA"],
        // G14
        ["BOLOGNA","ROMA"], ["FIORENTINA","CAGLIARI"], ["FROSINONE","INTER"], ["GENOA","TORINO"], ["JUVENTUS","UDINESE"], ["LAZIO","ATALANTA"], ["MILAN","PARMA"], ["MONZA","COMO"], ["NAPOLI","LECCE"], ["VENEZIA","SASSUOLO"],
        // G15
        ["ATALANTA","GENOA"], ["CAGLIARI","VENEZIA"], ["COMO","BOLOGNA"], ["INTER","TORINO"], ["JUVENTUS","MONZA"], ["LAZIO","ROMA"], ["LECCE","SASSUOLO"], ["NAPOLI","MILAN"], ["PARMA","FIORENTINA"], ["UDINESE","FROSINONE"],
        // G16
        ["ATALANTA","NAPOLI"], ["FIORENTINA","BOLOGNA"], ["FROSINONE","LAZIO"], ["GENOA","UDINESE"], ["LECCE","INTER"], ["MILAN","COMO"], ["ROMA","JUVENTUS"], ["SASSUOLO","PARMA"], ["TORINO","CAGLIARI"], ["VENEZIA","MONZA"],
        // G17
        ["BOLOGNA","JUVENTUS"], ["CAGLIARI","GENOA"], ["COMO","LECCE"], ["FIORENTINA","LAZIO"], ["INTER","SASSUOLO"], ["MONZA","MILAN"], ["PARMA","NAPOLI"], ["ROMA","FROSINONE"], ["TORINO","VENEZIA"], ["UDINESE","ATALANTA"],
        // G18
        ["ATALANTA","COMO"], ["FROSINONE","BOLOGNA"], ["GENOA","MONZA"], ["JUVENTUS","TORINO"], ["LAZIO","INTER"], ["LECCE","PARMA"], ["MILAN","FIORENTINA"], ["NAPOLI","CAGLIARI"], ["SASSUOLO","UDINESE"], ["VENEZIA","ROMA"],
        // G19
        ["BOLOGNA","GENOA"], ["CAGLIARI","SASSUOLO"], ["COMO","LAZIO"], ["FIORENTINA","LECCE"], ["INTER","JUVENTUS"], ["MONZA","FROSINONE"], ["PARMA","VENEZIA"], ["ROMA","MILAN"], ["TORINO","ATALANTA"], ["UDINESE","NAPOLI"],
        // G20
        ["ATALANTA","ROMA"], ["CAGLIARI","COMO"], ["JUVENTUS","GENOA"], ["LAZIO","BOLOGNA"], ["LECCE","UDINESE"], ["MILAN","TORINO"], ["NAPOLI","FIORENTINA"], ["PARMA","INTER"], ["SASSUOLO","MONZA"], ["VENEZIA","FROSINONE"],
        // G21
        ["BOLOGNA","ATALANTA"], ["COMO","NAPOLI"], ["FIORENTINA","SASSUOLO"], ["FROSINONE","MILAN"], ["GENOA","PARMA"], ["INTER","VENEZIA"], ["JUVENTUS","CAGLIARI"], ["LECCE","TORINO"], ["MONZA","LAZIO"], ["ROMA","UDINESE"],
        // G22
        ["ATALANTA","FIORENTINA"], ["CAGLIARI","PARMA"], ["GENOA","LECCE"], ["LAZIO","VENEZIA"], ["MILAN","JUVENTUS"], ["MONZA","ROMA"], ["NAPOLI","INTER"], ["SASSUOLO","COMO"], ["TORINO","FROSINONE"], ["UDINESE","BOLOGNA"],
        // G23
        ["ATALANTA","LAZIO"], ["BOLOGNA","MILAN"], ["COMO","MONZA"], ["FIORENTINA","UDINESE"], ["INTER","CAGLIARI"], ["JUVENTUS","SASSUOLO"], ["LECCE","NAPOLI"], ["PARMA","FROSINONE"], ["ROMA","TORINO"], ["VENEZIA","GENOA"],
        // G24
        ["BOLOGNA","COMO"], ["CAGLIARI","LAZIO"], ["FROSINONE","FIORENTINA"], ["GENOA","ATALANTA"], ["INTER","MILAN"], ["MONZA","LECCE"], ["NAPOLI","JUVENTUS"], ["ROMA","PARMA"], ["TORINO","SASSUOLO"], ["UDINESE","VENEZIA"],
        // G25
        ["ATALANTA","MONZA"], ["COMO","TORINO"], ["FIORENTINA","INTER"], ["JUVENTUS","BOLOGNA"], ["LAZIO","NAPOLI"], ["LECCE","FROSINONE"], ["MILAN","GENOA"], ["SASSUOLO","ROMA"], ["UDINESE","PARMA"], ["VENEZIA","CAGLIARI"],
        // G26
        ["BOLOGNA","LECCE"], ["CAGLIARI","UDINESE"], ["COMO","MILAN"], ["FROSINONE","NAPOLI"], ["GENOA","LAZIO"], ["INTER","ATALANTA"], ["MONZA","JUVENTUS"], ["PARMA","SASSUOLO"], ["ROMA","VENEZIA"], ["TORINO","FIORENTINA"],
        // G27
        ["ATALANTA","TORINO"], ["FIORENTINA","VENEZIA"], ["JUVENTUS","ROMA"], ["LAZIO","FROSINONE"], ["LECCE","COMO"], ["MILAN","CAGLIARI"], ["MONZA","GENOA"], ["NAPOLI","PARMA"], ["SASSUOLO","BOLOGNA"], ["UDINESE","INTER"],
        // G28
        ["BOLOGNA","NAPOLI"], ["CAGLIARI","FIORENTINA"], ["COMO","UDINESE"], ["FROSINONE","MONZA"], ["GENOA","ROMA"], ["LAZIO","JUVENTUS"], ["MILAN","SASSUOLO"], ["PARMA","LECCE"], ["TORINO","INTER"], ["VENEZIA","ATALANTA"],
        // G29
        ["CAGLIARI","NAPOLI"], ["COMO","FIORENTINA"], ["FROSINONE","UDINESE"], ["GENOA","INTER"], ["LECCE","LAZIO"], ["MILAN","MONZA"], ["ROMA","BOLOGNA"], ["SASSUOLO","ATALANTA"], ["TORINO","JUVENTUS"], ["VENEZIA","PARMA"],
        // G30
        ["ATALANTA","MILAN"], ["FIORENTINA","GENOA"], ["INTER","FROSINONE"], ["JUVENTUS","COMO"], ["MONZA","BOLOGNA"], ["NAPOLI","VENEZIA"], ["PARMA","LAZIO"], ["ROMA","LECCE"], ["SASSUOLO","CAGLIARI"], ["UDINESE","TORINO"],
        // G31
        ["BOLOGNA","VENEZIA"], ["CAGLIARI","ATALANTA"], ["FIORENTINA","MILAN"], ["FROSINONE","GENOA"], ["INTER","ROMA"], ["JUVENTUS","LECCE"], ["LAZIO","TORINO"], ["NAPOLI","SASSUOLO"], ["PARMA","COMO"], ["UDINESE","MONZA"],
        // G32
        ["ATALANTA","UDINESE"], ["BOLOGNA","CAGLIARI"], ["COMO","FROSINONE"], ["FIORENTINA","PARMA"], ["MILAN","NAPOLI"], ["MONZA","INTER"], ["ROMA","LAZIO"], ["SASSUOLO","LECCE"], ["TORINO","GENOA"], ["VENEZIA","JUVENTUS"],
        // G33
        ["CAGLIARI","MONZA"], ["FROSINONE","ROMA"], ["GENOA","SASSUOLO"], ["INTER","BOLOGNA"], ["JUVENTUS","FIORENTINA"], ["LAZIO","COMO"], ["LECCE","MILAN"], ["NAPOLI","UDINESE"], ["PARMA","ATALANTA"], ["VENEZIA","TORINO"],
        // G34
        ["ATALANTA","JUVENTUS"], ["BOLOGNA","FIORENTINA"], ["COMO","INTER"], ["LECCE","CAGLIARI"], ["MILAN","LAZIO"], ["MONZA","VENEZIA"], ["ROMA","NAPOLI"], ["SASSUOLO","FROSINONE"], ["TORINO","PARMA"], ["UDINESE","GENOA"],
        // G35
        ["FIORENTINA","ROMA"], ["FROSINONE","ATALANTA"], ["GENOA","CAGLIARI"], ["INTER","LECCE"], ["LAZIO","SASSUOLO"], ["NAPOLI","MONZA"], ["PARMA","MILAN"], ["TORINO","BOLOGNA"], ["UDINESE","JUVENTUS"], ["VENEZIA","COMO"],
        // G36
        ["BOLOGNA","FROSINONE"], ["CAGLIARI","TORINO"], ["COMO","ATALANTA"], ["JUVENTUS","INTER"], ["LAZIO","UDINESE"], ["LECCE","FIORENTINA"], ["MILAN","ROMA"], ["MONZA","PARMA"], ["NAPOLI","GENOA"], ["SASSUOLO","VENEZIA"],
        // G37
        ["BOLOGNA","PARMA"], ["CAGLIARI","ROMA"], ["COMO","GENOA"], ["JUVENTUS","FROSINONE"], ["LAZIO","FIORENTINA"], ["LECCE","VENEZIA"], ["MILAN","UDINESE"], ["MONZA","TORINO"], ["NAPOLI","ATALANTA"], ["SASSUOLO","INTER"],
        // G38
        ["ATALANTA","LECCE"], ["FIORENTINA","MONZA"], ["FROSINONE","CAGLIARI"], ["GENOA","BOLOGNA"], ["INTER","LAZIO"], ["PARMA","JUVENTUS"], ["ROMA","COMO"], ["TORINO","NAPOLI"], ["UDINESE","SASSUOLO"], ["VENEZIA","MILAN"]
    ];

    // Helper per normalizzare i nomi
    function normalize(name) {
        return name.substring(0,3).toUpperCase();
    }

    // Costruzione della struttura calendario reale
    const schedule = {};
    teams.forEach(t => schedule[t] = []);

    function getMatchDifficulty(myTeam, opponent) {
        const myTier = teamTiers[myTeam];
        const oppTier = teamTiers[opponent];
        if (myTier === oppTier) return 2;
        if (myTier < oppTier) return 3; // Facile
        if (myTier > oppTier) return 1; // Difficile
        return 2;
    }

    // Popolamento del calendario reale
    for (let i = 0; i < rawMatches.length; i++) {
        const home = normalize(rawMatches[i][0]);
        const away = normalize(rawMatches[i][1]);

        if (schedule[home]) {
            schedule[home].push({
                opponent: away,
                home: true,
                diff: getMatchDifficulty(home, away)
            });
        }
        if (schedule[away]) {
            schedule[away].push({
                opponent: home,
                home: false,
                diff: getMatchDifficulty(away, home)
            });
        }
    }

    function initSelectors() {
        const selects = [document.getElementById('team1'), document.getElementById('team2'), document.getElementById('team3')];
        selects.forEach((sel, idx) => {
            sel.innerHTML = `<option value="">-- Squadra ${idx+1} --</option>`;
            teams.forEach(t => sel.innerHTML += `<option value="${t}">${t}</option>`);
        });
        selects[0].value = "JUV";
        selects[1].value = "TOR";
        selects[2].value = "";
    }

    function calculate() {
        const t1 = document.getElementById('team1').value;
        const t2 = document.getElementById('team2').value;
        const t3 = document.getElementById('team3').value;
        const selected = [t1, t2, t3].filter(t => t !== "");

        if(selected.length === 0) return;

        let totalScore = 0;
        let easy = 0, medium = 0, hard = 0;
        let bestPicks = [];

        for(let g=0; g<38; g++) {
            let bestTeam = selected[0];
            let bestVal = -1;

            selected.forEach(t => {
                const match = schedule[t][g];
                if(match) {
                    let val = match.diff + (match.home ? 0.2 : 0);
                    if(val > bestVal) {
                        bestVal = val;
                        bestTeam = t;
                    }
                }
            });

            bestPicks.push({ g: g+1, team: bestTeam, match: schedule[bestTeam][g] });
            
            const d = schedule[bestTeam][g].diff;
            if(d === 3) easy++;
            else if(d === 2) medium++;
            else hard++;

            totalScore += bestVal;
        }

        const finalScore = Math.min(100, Math.round((totalScore / (38 * 3.2)) * 100));

        document.getElementById('scoreVal').innerText = finalScore;
        document.getElementById('easyCount').innerText = easy;
        document.getElementById('mediumCount').innerText = medium;
        document.getElementById('hardCount').innerText = hard;

        renderMatrix(selected, bestPicks);
    }

    function renderMatrix(selectedTeams, bestPicks) {
        const matrix = document.getElementById('matrix');
        matrix.innerHTML = '';

        matrix.innerHTML += `<div class="cell header">Sq / G</div>`;
        for(let g=1; g<=38; g++) {
            matrix.innerHTML += `<div class="cell header">${g}</div>`;
        }

        selectedTeams.forEach(team => {
            matrix.innerHTML += `<div class="cell team-name">${team}</div>`;
            for(let g=0; g<38; g++) {
                const match = schedule[team][g];
                const isBest = bestPicks[g].team === team;
                
                let diffClass = match.diff === 3 ? 'easy-bg' : (match.diff === 2 ? 'medium-bg' : 'hard-bg');
                let bestClass = isBest ? 'best' : '';
                let label = (match.home ? 'C-' : 'F-') + match.opponent;

                matrix.innerHTML += `<div class="cell ${diffClass} ${bestClass}">${label}</div>`;
            }
        });
    }

    function saveCombo() {
        const name = document.getElementById('comboName').value || "Combinazione senza nome";
        const t1 = document.getElementById('team1').value;
        const t2 = document.getElementById('team2').value;
        const t3 = document.getElementById('team3').value;
        const score = document.getElementById('scoreVal').innerText;

        const saved = JSON.parse(localStorage.getItem('fanta_combos') || '[]');
        saved.push({ name, t1, t2, t3, score });
        localStorage.setItem('fanta_combos', JSON.stringify(saved));
        
        document.getElementById('comboName').value = '';
        loadSaved();
    }

    function loadSaved() {
        const saved = JSON.parse(localStorage.getItem('fanta_combos') || '[]');
        const container = document.getElementById('savedContainer');
        if(saved.length === 0) {
            container.innerHTML = "Nessuna combinazione salvata.";
            return;
        }

        container.innerHTML = saved.map((item, idx) => `
            <div class="saved-item">
                <div>
                    <strong>${item.name}</strong> (${item.t1}${item.t2 ? ' - ' + item.t2 : ''}${item.t3 ? ' - ' + item.t3 : ''})
                    <span style="color:var(--accent); margin-left:10px;">${item.score}/100</span>
                </div>
                <button class="btn-delete" onclick="deleteCombo(${idx})">Elimina</button>
            </div>
        `).join('');
    }

    function deleteCombo(idx) {
        const saved = JSON.parse(localStorage.getItem('fanta_combos') || '[]');
        saved.splice(idx, 1);
        localStorage.setItem('fanta_combos', JSON.stringify(saved));
        loadSaved();
    }

    initSelectors();
    calculate();
    loadSaved();
</script>
</body>
</html>
