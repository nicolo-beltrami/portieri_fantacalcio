<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FantaHub Pro 26/27</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0d17;
            --card-bg: rgba(22, 27, 46, 0.7);
            --card-border: rgba(255, 255, 255, 0.08);
            --accent: #00ff88;
            --accent-glow: rgba(0, 255, 136, 0.25);
            --text: #ffffff;
            --subtext: #8b949e;
            --easy: #00ff88;
            --medium: #ffb700;
            --hard: #ff3366;
            
            --role-p: #ffcc00;
            --role-d: #00cc66;
            --role-c: #0099ff;
            --role-a: #ff3366;
        }

        * { box-sizing: border-box; transition: all 0.2s ease; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 10% 10%, rgba(0, 255, 136, 0.05) 0px, transparent 50%),
                radial-gradient(at 90% 90%, rgba(120, 80, 255, 0.05) 0px, transparent 50%);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container { max-width: 1000px; width: 100%; }

        /* TAB NAVIGATION */
        .nav-tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
            background: rgba(255,255,255,0.03);
            padding: 6px;
            border-radius: 16px;
            border: 1px solid var(--card-border);
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--subtext);
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            width: 50%;
            text-align: center;
        }

        .tab-btn.active {
            background: var(--card-bg);
            color: var(--accent);
            border: 1px solid var(--card-border);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .header-title { text-align: center; margin-bottom: 25px; }
        .header-title h1 {
            font-size: 2rem; font-weight: 900; margin: 0 0 8px 0;
            background: linear-gradient(135deg, #fff 30%, var(--subtext));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .header-title p { color: var(--subtext); margin: 0; font-size: 0.9rem; }

        /* CONTROLLI INFORMATI */
        .filter-bar {
            display: grid;
            grid-template-columns: 2fr 1fr 1.2fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        @media (max-width: 700px) {
            .filter-bar { grid-template-columns: 1fr; }
        }

        input[type="text"], select {
            appearance: none;
            background-color: var(--card-bg);
            backdrop-filter: blur(12px);
            color: var(--text);
            border: 1px solid var(--card-border);
            padding: 12px 16px; border-radius: 12px;
            font-size: 0.95rem; font-weight: 600; width: 100%; outline: none;
        }

        select:focus, input:focus { border-color: var(--accent); box-shadow: 0 0 15px var(--accent-glow); }

        /* GRID INFORMATI */
        .injured-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
        }

        .player-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .player-info { display: flex; align-items: center; gap: 12px; }

        .role-badge {
            width: 32px; height: 32px;
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-weight: 900; font-size: 0.85rem; color: #000;
            flex-shrink: 0;
        }
        .role-P { background: var(--role-p); }
        .role-D { background: var(--role-d); }
        .role-C { background: var(--role-c); }
        .role-A { background: var(--role-a); color: #fff; }

        .player-details { display: flex; flex-direction: column; }
        .player-name { font-weight: 800; font-size: 1rem; color: #fff; }
        .player-team { display: flex; align-items: center; gap: 6px; font-size: 0.8rem; color: var(--subtext); margin-top: 2px; }
        .team-icon-sm { width: 16px; height: 16px; object-fit: contain; }

        .return-badge {
            text-align: right;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--card-border);
            padding: 6px 12px;
            border-radius: 10px;
        }
        .return-label { font-size: 0.65rem; color: var(--subtext); text-transform: uppercase; font-weight: 700; }
        .return-value { font-size: 0.9rem; font-weight: 800; color: var(--accent); }
        .return-value.long { color: var(--hard); }
        .return-value.medium { color: var(--medium); }

        /* PORTIERI STYLES */
        .selectors-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .dashboard-card { background: var(--card-bg); backdrop-filter: blur(16px); border: 1px solid var(--card-border); border-radius: 20px; padding: 25px; display: grid; grid-template-columns: 180px 1fr; gap: 20px; align-items: center; margin-bottom: 25px; }
        @media (max-width: 600px) { .dashboard-card { grid-template-columns: 1fr; text-align: center; } }
        .score-box { display: flex; flex-direction: column; align-items: center; justify-content: center; border-right: 1px solid var(--card-border); padding-right: 20px; }
        @media (max-width: 600px) { .score-box { border-right: none; border-bottom: 1px solid var(--card-border); padding-right: 0; padding-bottom: 20px; } }
        .circle-score { width: 100px; height: 100px; border-radius: 50%; background: radial-gradient(circle, rgba(0,255,136,0.1) 0%, transparent 70%); border: 4px solid var(--accent); box-shadow: 0 0 20px var(--accent-glow); display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .score-val { font-size: 2.2rem; font-weight: 900; color: var(--accent); line-height: 1; }
        .score-max { font-size: 0.75rem; color: var(--subtext); margin-top: 4px; font-weight: 600; }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
        .stat-box { background: rgba(255, 255, 255, 0.03); border: 1px solid var(--card-border); padding: 12px; border-radius: 12px; text-align: center; }
        .stat-num { font-size: 1.5rem; font-weight: 900; margin-bottom: 2px; }
        .stat-num.easy { color: var(--easy); }
        .stat-num.medium { color: var(--medium); }
        .stat-num.hard { color: var(--hard); }
        .stat-label { font-size: 0.75rem; color: var(--subtext); text-transform: uppercase; font-weight: 700; }
        .matrix-container { background: var(--card-bg); backdrop-filter: blur(16px); border-radius: 20px; padding: 20px; border: 1px solid var(--card-border); margin-bottom: 25px; overflow-x: auto; }
        .matrix { display: grid; grid-template-columns: 90px repeat(38, 62px); gap: 6px; align-items: center; }
        .cell { height: 46px; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 8px; font-size: 0.7rem; font-weight: 700; background: rgba(255, 255, 255, 0.03); }
        .cell.header { background: transparent; color: var(--subtext); font-size: 0.7rem; text-transform: uppercase; }
        .cell.team-name { font-weight: 900; font-size: 0.85rem; color: #fff; background: rgba(255,255,255,0.05); gap: 3px; }
        .cell.easy-bg { background: rgba(0, 255, 136, 0.12); color: var(--easy); border-color: rgba(0, 255, 136, 0.2); }
        .cell.medium-bg { background: rgba(255, 183, 0, 0.12); color: var(--medium); border-color: rgba(255, 183, 0, 0.2); }
        .cell.hard-bg { background: rgba(255, 51, 102, 0.12); color: var(--hard); border-color: rgba(255, 51, 102, 0.2); }
        .cell.best { transform: scale(1.05); border: 2px solid #fff !important; z-index: 2; }
        .cell .badge { font-size: 0.55rem; opacity: 0.7; margin-bottom: 1px; }
        .match-info { display: flex; align-items: center; gap: 4px; }
        .team-icon { width: 14px; height: 14px; object-fit: contain; }
        .header-icon { width: 18px; height: 18px; object-fit: contain; }
        .save-section { display: flex; gap: 12px; margin-bottom: 25px; }
        button.btn-primary { background: var(--accent); color: #000; border: none; padding: 0 25px; border-radius: 12px; font-weight: 800; font-size: 0.95rem; cursor: pointer; }
        .saved-card { background: var(--card-bg); border-radius: 20px; padding: 20px; border: 1px solid var(--card-border); }
        .saved-card h3 { margin: 0 0 15px 0; font-size: 1.1rem; color: var(--subtext); }
        .saved-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: rgba(255,255,255,0.02); border: 1px solid var(--card-border); border-radius: 10px; margin-bottom: 8px; }
        .btn-delete { background: rgba(255, 51, 102, 0.15); color: var(--hard); border: 1px solid rgba(255, 51, 102, 0.3); padding: 6px 12px; border-radius: 8px; font-weight: 700; font-size: 0.8rem; cursor: pointer; }
    </style>
</head>

<div class="container">
    
    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('portieri')">Griglia Portieri</button>
        <button class="tab-btn" onclick="switchTab('infortunati')">Report Infortunati</button>
    </div>

    <!-- TAB 1: PORTIERI -->
    <div id="tab-portieri" class="tab-content active">
        <div class="header-title">
            <h1>Griglia Portieri Pro</h1>
            <p>Serie A 2026/2027 • Incroci Ottimali</p>
        </div>

        <div class="selectors-grid">
            <select id="team1" onchange="calculate()"></select>
            <select id="team2" onchange="calculate()"></select>
            <select id="team3" onchange="calculate()"></select>
        </div>

        <div class="dashboard-card">
            <div class="score-box">
                <div class="circle-score"><span class="score-val" id="scoreVal">0</span></div>
                <span class="score-max">INDICE DI COPPIA</span>
            </div>
            <div class="stats-grid">
                <div class="stat-box">
                    <div class="stat-num easy" id="easyCount">0</div>
                    <div class="stat-label">Facili</div>
                </div>
                <div class="stat-box">
                    <div class="stat-num medium" id="mediumCount">0</div>
                    <div class="stat-label">Medie</div>
                </div>
                <div class="stat-box">
                    <div class="stat-num hard" id="hardCount">0</div>
                    <div class="stat-label">Difficili</div>
                </div>
            </div>
        </div>

        <div class="matrix-container">
            <div class="matrix" id="matrix"></div>
        </div>

        <div class="save-section">
            <input type="text" id="comboName" placeholder="Nome combinazione (es. Trio Juve-Torino-Monza)">
            <button class="btn-primary" onclick="saveCombo()">Salva Trio</button>
        </div>

        <div class="saved-card">
            <h3>Combinazioni Salvate</h3>
            <div id="savedContainer">Nessuna combinazione salvata.</div>
        </div>
    </div>

    <!-- TAB 2: INFORMATI -->
    <div id="tab-infortunati" class="tab-content">
        <div class="header-title">
            <h1>Lista Infortunati Asta</h1>
            <p>Tempi di rientro e giornate previste</p>
        </div>

        <div class="filter-bar">
            <input type="text" id="searchPlayer" placeholder="Cerca giocatore..." oninput="filterInjured()">
            <select id="filterRole" onchange="filterInjured()">
                <option value="">Tutti i Ruoli</option>
                <option value="P">Portieri (P)</option>
                <option value="D">Difensori (D)</option>
                <option value="C">Centrocampisti (C)</option>
                <option value="A">Attaccanti (A)</option>
            </select>
            <select id="filterTeam" onchange="filterInjured()">
                <option value="">Tutte le Squadre</option>
            </select>
        </div>

        <div class="injured-grid" id="injuredGrid"></div>
    </div>

</div>

    ];

    function normalize(name) { return name.substring(0,3).toUpperCase(); }

    const schedule = {};
    teams.forEach(t => schedule[t] = []);

    function getMatchDifficulty(myTeam, opponent) {
        const myTier = teamTiers[myTeam];
        const oppTier = teamTiers[opponent];
        if (myTier === oppTier) return 2;
        if (myTier < oppTier) return 3;
        if (myTier > oppTier) return 1;
        return 2;
    }

    for (let i = 0; i < rawMatches.length; i++) {
        const home = normalize(rawMatches[i][0]);
        const away = normalize(rawMatches[i][1]);

        if (schedule[home]) schedule[home].push({ opponent: away, home: true, diff: getMatchDifficulty(home, away) });
        if (schedule[away]) schedule[away].push({ opponent: home, home: false, diff: getMatchDifficulty(away, home) });
    }

    function switchTab(tab) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        
        if(tab === 'portieri') {
            document.querySelectorAll('.tab-btn')[0].classList.add('active');
            document.getElementById('tab-portieri').classList.add('active');
        } else {
            document.querySelectorAll('.tab-btn')[1].classList.add('active');
            document.getElementById('tab-infortunati').classList.add('active');
            filterInjured();
        }
    }

    function initSelectors() {
        const selects = [document.getElementById('team1'), document.getElementById('team2'), document.getElementById('team3')];
        selects.forEach((sel, idx) => {
            sel.innerHTML = `<option value="">-- Portiere ${idx+1} --</option>`;
            teams.forEach(t => sel.innerHTML += `<option value="${t}">${t}</option>`);
        });
        selects[0].value = "JUV";
        selects[1].value = "TOR";
        selects[2].value = "";

        const teamFilter = document.getElementById('filterTeam');
        teams.forEach(t => teamFilter.innerHTML += `<option value="${t}">${t}</option>`);
    }

    function calculate() {
        const t1 = document.getElementById('team1').value;
        const t2 = document.getElementById('team2').value;
        const t3 = document.getElementById('team3').value;
        const selected = [t1, t2, t3].filter(t => t !== "");

        if(selected.length === 0) return;

        let totalScore = 0;
        let easy = 0, medium = 0, hard = 0;
        let bestPicks = [];

        for(let g=0; g<38; g++) {
            let bestTeam = selected[0];
            let bestVal = -1;

            selected.forEach(t => {
                const match = schedule[t][g];
                if(match) {
                    let val = match.diff + (match.home ? 0.2 : 0);
                    if(val > bestVal) {
                        bestVal = val;
                        bestTeam = t;
                    }
                }
            });

            bestPicks.push({ g: g+1, team: bestTeam, match: schedule[bestTeam][g] });
            
            const d = schedule[bestTeam][g].diff;
            if(d === 3) easy++;
            else if(d === 2) medium++;
            else hard++;

            totalScore += bestVal;
        }

        const finalScore = Math.min(100, Math.round((totalScore / (38 * 3.2)) * 100));

        document.getElementById('scoreVal').innerText = finalScore;
        document.getElementById('easyCount').innerText = easy;
        document.getElementById('mediumCount').innerText = medium;
        document.getElementById('hardCount').innerText = hard;

        renderMatrix(selected, bestPicks);
    }

    function renderMatrix(selectedTeams, bestPicks) {
        const matrix = document.getElementById('matrix');
        matrix.innerHTML = '';

        matrix.innerHTML += `<div class="cell header">Squadra</div>`;
        for(let g=1; g<=38; g++) {
            matrix.innerHTML += `<div class="cell header">G${g}</div>`;
        }

        selectedTeams.forEach(team => {
            const teamLogoUrl = typeof teamLogos !== 'undefined' ? teamLogos[team] : '';
            matrix.innerHTML += `
                <div class="cell team-name">
                    ${teamLogoUrl ? `<img src="${teamLogoUrl}" class="header-icon" alt="${team}">` : ''}
                    <span>${team}</span>
                </div>`;

            for(let g=0; g<38; g++) {
                const match = schedule[team][g];
                const isBest = bestPicks[g].team === team;
                
                let diffClass = match.diff === 3 ? 'easy-bg' : (match.diff === 2 ? 'medium-bg' : 'hard-bg');
                let bestClass = isBest ? 'best' : '';
                let homeBadge = match.home ? 'C' : 'F';
                let oppLogoUrl = typeof teamLogos !== 'undefined' ? teamLogos[match.opponent] : '';

                matrix.innerHTML += `
                    <div class="cell ${diffClass} ${bestClass}">
                        <span class="badge">${homeBadge}</span>
                        <div class="match-info">
                            ${oppLogoUrl ? `<img src="${oppLogoUrl}" class="team-icon" alt="${match.opponent}">` : ''}
                            <span>${match.opponent}</span>
                        </div>
                    </div>`;
            }
        });
    }

    function filterInjured() {
        const search = document.getElementById('searchPlayer').value.toLowerCase();
        const role = document.getElementById('filterRole').value;
        const team = document.getElementById('filterTeam').value;

        const filtered = injuredData.filter(p => {
            const matchSearch = p.name.toLowerCase().includes(search);
            const matchRole = role === "" || p.role === role;
            const matchTeam = team === "" || p.team === team;
            return matchSearch && matchRole && matchTeam;
        });

        renderInjured(filtered);
    }

    function renderInjured(list) {
        const container = document.getElementById('injuredGrid');
        container.innerHTML = '';

        if(list.length === 0) {
            container.innerHTML = `<div style="color:var(--subtext); grid-column: 1/-1; text-align:center; padding: 20px;">Nessun giocatore trovato con questi filtri.</div>`;
            return;
        }

        list.sort((a, b) => a.returnG - b.returnG);

        list.forEach(p => {
            const logoUrl = typeof teamLogos !== 'undefined' ? teamLogos[p.team] : '';
            let returnClass = '';
            if (p.returnG > 10) returnClass = 'long';
            else if (p.returnG > 5) returnClass = 'medium';

            container.innerHTML += `
                <div class="player-card">
                    <div class="player-info">
                        <div class="role-badge role-${p.role}">${p.role}</div>
                        <div class="player-details">
                            <span class="player-name">${p.name}</span>
                            <span class="player-team">
                                ${logoUrl ? `<img src="${logoUrl}" class="team-icon-sm" alt="${p.team}">` : ''}
                                ${p.team}
                            </span>
                        </div>
                    </div>
                    <div class="return-badge">
                        <div class="return-label">Rientro</div>
                        <div class="return-value ${returnClass}">Giornata ${p.returnG}</div>
                    </div>
                </div>
            `;
        });
    }

    function saveCombo() {
        const name = document.getElementById('comboName').value || "Trio Personalizzato";
        const t1 = document.getElementById('team1').value;
        const t2 = document.getElementById('team2').value;
        const t3 = document.getElementById('team3').value;
        const score = document.getElementById('scoreVal').innerText;

        const saved = JSON.parse(localStorage.getItem('fanta_combos') || '[]');
        saved.push({ name, t1, t2, t3, score });
        localStorage.setItem('fanta_combos', JSON.stringify(saved));
        
        document.getElementById('comboName').value = '';
        loadSaved();
    }

    function loadSaved() {
        const saved = JSON.parse(localStorage.getItem('fanta_combos') || '[]');
        const container = document.getElementById('savedContainer');
        if(saved.length === 0) {
            container.innerHTML = "<span style='color:var(--subtext); font-size:0.85rem;'>Nessuna combinazione salvata.</span>";
            return;
        }

        container.innerHTML = saved.map((item, idx) => `
            <div class="saved-item">
                <div>
                    <strong>${item.name}</strong> 
                    <span style="color:var(--subtext); font-size:0.85rem; margin-left:8px;">(${item.t1}${item.t2 ? ' - ' + item.t2 : ''}${item.t3 ? ' - ' + item.t3 : ''})</span>
                    <span style="color:var(--accent); font-weight:800; margin-left:12px;">${item.score}/100</span>
                </div>
                <button class="btn-delete" onclick="deleteCombo(${idx})">Elimina</button>
            </div>
        `).join('');
    }

    function deleteCombo(idx) {
        const saved = JSON.parse(localStorage.getItem('fanta_combos') || '[]');
        saved.splice(idx, 1);
        localStorage.setItem('fanta_combos', JSON.stringify(saved));
        loadSaved();
    }

    initSelectors();
    calculate();
    loadSaved();
</script>
